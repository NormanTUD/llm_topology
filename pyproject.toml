[project]
name = "llm-topology"
version = "0.1.0"
description = "A local laboratory for testing topological representations in a custom transformer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "gudhi>=3.10",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "ripser>=0.6.4",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]
train = [
  "scikit-learn>=1.4",
  "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_topology"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: computationally expensive tests that may be skipped locally",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv]
package = true
